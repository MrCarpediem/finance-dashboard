services:
  # ── API Gateway ──
  - type: web
    name: api-gateway
    runtime: docker
    region: oregon
    dockerfilePath: ./services/api-gateway/Dockerfile
    dockerContext: ./services/api-gateway
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: JWT_SECRET
        fromGroup: finance-shared-secrets
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: auth-service
          envVarKey: RENDER_INTERNAL_HOSTNAME
      - key: FINANCE_SERVICE_URL
        fromService:
          type: web
          name: finance-service
          envVarKey: RENDER_INTERNAL_HOSTNAME
      - key: ANALYTICS_SERVICE_URL
        fromService:
          type: web
          name: finance-analytics-service
          envVarKey: RENDER_INTERNAL_HOSTNAME

  # ── Auth Service ──
  - type: web
    name: auth-service
    runtime: docker
    region: oregon
    dockerfilePath: ./services/auth-service/Dockerfile
    dockerContext: ./services/auth-service
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4001"
      - key: JWT_SECRET
        fromGroup: finance-shared-secrets
      - key: JWT_REFRESH_SECRET
        fromGroup: finance-shared-secrets
      - key: JWT_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: DATABASE_URL
        fromDatabase:
          name: finance-db
          property: connectionString

  # ── Finance Service ──
  - type: web
    name: finance-service
    runtime: docker
    region: oregon
    dockerfilePath: ./services/finance-service/Dockerfile
    dockerContext: ./services/finance-service
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET
        fromGroup: finance-shared-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: finance-db
          property: connectionString

  # ── Analytics Service ──
  - type: web
    name: finance-analytics-service
    runtime: docker
    region: oregon
    dockerfilePath: ./services/analytics-service/Dockerfile
    dockerContext: ./services/analytics-service
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET
        fromGroup: finance-shared-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: finance-db
          property: connectionString

databases:
  - name: finance-db
    region: oregon
    plan: free
    databaseName: finance_db
    user: finance_admin

envVarGroups:
  - name: finance-shared-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
